<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search — Oasis Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon2.svg">

    <script src="main.js"></script>
</head>
<body class="search-page">

<!-- ============================================= -->
<!-- SEARCH HERO START                              -->
<!-- ============================================= -->
<div class="search-hero">

    <img src="images/banner.jpg" alt="Glass blocks reimagined" class="search-hero__bg">

    <div class="search-top-bar">
        <a href="discover.html" class="search-top-bar__back" aria-label="Go back">
            <img src="images/arrow-left.svg" alt="Back">
        </a>
        <div class="search-bar">
            <img src="images/search.svg" alt="Search">
            <input type="text" placeholder="Search stories..." aria-label="Search stories">
        </div>
    </div>

    <div class="search-hero__text">
        <span class="search-hero__eyebrow">Art deco rediscovered</span>
        <h2 class="search-hero__title">Glass blocks, reimagined</h2>
    </div>

</div>
<!-- ============================================= -->
<!-- SEARCH HERO END                                -->
<!-- ============================================= -->


<!-- ============================================= -->
<!-- CURATED BOARDS START                           -->
<!-- ============================================= -->
<section class="curated-boards-section">
    <div class="container">

        <span class="curated-boards__eyebrow">Oasis Curated Boards</span>
        <h2 class="curated-boards__title">Ideas you might like</h2>

        <div class="curated-boards__scroll">

            <a href="category-posts.html" class="board-card">
                <div class="board-card__collage">
                    <img src="images/wedding-1.png" alt="Table setting with flowers" class="board-card__main">
                    <img src="images/wedding-2.png" alt="Floral arch" class="board-card__small">
                    <img src="images/wedding-3.png" alt="String lights at venue" class="board-card__small">
                </div>
                <p class="board-card__title">Earthy wedding aesthetic</p>
                <span class="board-card__meta">51 Pins</span>
            </a>

            <a href="category-posts.html" class="board-card">
                <div class="board-card__collage">
                    <img src="images/beach-1.png" alt="Beach house over water" class="board-card__main">
                    <img src="images/beach-2.png" alt="Ocean view" class="board-card__small">
                    <img src="images/beach-3.png" alt="Beach chairs" class="board-card__small">
                </div>
                <p class="board-card__title">Sea aesthetic</p>
                <span class="board-card__meta">79 Pins</span>
            </a>

            <a href="category-posts.html" class="board-card">
                <div class="board-card__collage">
                    <img src="images/city-1.jpg" alt="City skyline at night" class="board-card__main">
                    <img src="images/city-2.jpg" alt="Street with neon signs" class="board-card__small">
                    <img src="images/city-3.jpg" alt="Rooftop view" class="board-card__small">
                </div>
                <p class="board-card__title">Urban nights</p>
                <span class="board-card__meta">63 Pins</span>
            </a>

        </div>

    </div>
</section>
<!-- ============================================= -->
<!-- CURATED BOARDS END                             -->
<!-- ============================================= -->

</body>
</html>
