<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OASIS - Forgot Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css?v=5">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/brand/favicon2.svg?v=4">

    <!-- Primary Meta Tags -->
    <meta name="description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://oasis.design/">
    <meta property="og:title" content="OASIS | Curate Your World">
    <meta property="og:description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">
    <meta property="og:image" content="https://oasis.design/assets/images/content/abstractcurvedlight.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://oasis.design/">
    <meta property="twitter:title" content="OASIS | Curate Your World">
    <meta property="twitter:description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">
    <meta property="twitter:image" content="https://oasis.design/assets/images/content/abstractcurvedlight.jpg">
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="../index.html">
            <img src="../assets/images/brand/logo.svg" alt="OASIS Logo" class="auth-logo">
        </a>
        
        <div id="reset-request-view">
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">Enter the email address associated with your account, and we'll send you a link to reset your password.</p>

            <form class="auth-form" id="forgot-form" >
                <div>
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="auth-input" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="btn-auth">Send Reset Link</button>
            </form>
        </div>

        <div id="reset-success-view" class="auth-success">
            <div class="success-icon">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h1 class="auth-title">Check your inbox</h1>
            <p class="auth-subtitle">We've sent a password reset link to <strong id="sent-email">your email</strong>. Please check your spam folder if you don't see it within a few minutes.</p>
            <button class="btn-auth" onclick="window.location.href='reset-password.html'" style="background: transparent; color: var(--color-primary); border: 1px solid var(--color-border); margin-top: 0;">Simulate clicking email link</button>
        </div>

        <div class="auth-links">
            <a href="../index.html"><div class="dynamic-icon" style="-webkit-mask-image: url('../assets/images/icons/arrow-left.svg'); width: 16px; height: 16px; margin-right: 8px; vertical-align: middle;"></div>Back to sign in</a>
        </div>
    </div>

    <script src="../assets/js/pages/forgot-password.js"></script>
</body>
</html>
