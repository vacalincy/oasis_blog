  <!-- Action Button -->
  <rect x="44" y="228" width="792" height="46" rx="23" fill="#EDEDED" stroke="#D1D5DB" stroke-width="0.8"/>
  <g transform="translate(440, 228)">
    <text x="-12" y="29" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="-0.1">Explore OASIS</text>
    <g transform="translate(48, 16)">
      <path d="M10 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 1 11.5V5.5A1.5 1.5 0 0 1 2.5 4H8" stroke="#171717" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polyline points="9.5 2 13.5 2 13.5 6" stroke="#171717" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="6.5" y1="9" x2="13.2" y2="2.3" stroke="#171717" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
