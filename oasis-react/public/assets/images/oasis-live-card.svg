  <!-- Title -->
  <text x="44" y="54" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.3">OASIS</text>

  <!-- Slogan -->
  <text x="44" y="88" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15.5" font-weight="400">Escape the noise. Curate your reality.</text>

  <!-- Live Demo Tag -->
  <rect x="44" y="108" width="92" height="24" rx="12" fill="#071B0B" stroke="#10B981" stroke-opacity="0.35" stroke-width="1"/>
  <text x="90" y="124.5" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.2">Live Demo</text>

