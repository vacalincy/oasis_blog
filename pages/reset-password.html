<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OASIS - Create New Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css?v=5">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/brand/favicon2.svg?v=4">

    <!-- Primary Meta Tags -->
    <meta name="description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://oasis.design/">
    <meta property="og:title" content="OASIS | Curate Your World">
    <meta property="og:description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">
    <meta property="og:image" content="https://oasis.design/assets/images/content/abstractcurvedlight.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://oasis.design/">
    <meta property="twitter:title" content="OASIS | Curate Your World">
    <meta property="twitter:description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">
    <meta property="twitter:image" content="https://oasis.design/assets/images/content/abstractcurvedlight.jpg">
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="../index.html">
            <img src="../assets/images/brand/logo.svg" alt="OASIS Logo" class="auth-logo">
        </a>
        
        <h1 class="auth-title">Create new password</h1>
        <p class="auth-subtitle">Your new password must be at least 8 characters long and different from previously used passwords.</p>

        <form class="auth-form" id="reset-form" >
            <div>
                <label for="new-password">New password</label>
                <input type="password" id="new-password" class="auth-input" placeholder="••••••••" required minlength="8">
            </div>
            <div>
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" class="auth-input" placeholder="••••••••" required minlength="8">
                <span id="password-error" class="auth-error">Passwords do not match.</span>
            </div>
            <button type="submit" class="btn-auth">Reset Password</button>
        </form>

        <div class="auth-links">
            <a href="../index.html">← Back to sign in</a>
        </div>
    </div>

    <script src="../assets/js/pages/reset-password.js"></script>
</body>
</html>
