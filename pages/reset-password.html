<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OASIS - Create New Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/brand/favicon2.svg?v=2">
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="../index.html">
            <img src="../assets/images/brand/logo.svg" alt="OASIS Logo" class="auth-logo">
        </a>
        
        <h1 class="auth-title">Create new password</h1>
        <p class="auth-subtitle">Your new password must be at least 8 characters long and different from previously used passwords.</p>

        <form class="auth-form" id="reset-form" >
            <div>
                <label for="new-password">New password</label>
                <input type="password" id="new-password" class="auth-input" placeholder="••••••••" required minlength="8">
            </div>
            <div>
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" class="auth-input" placeholder="••••••••" required>
                <span id="password-error" class="auth-error">Passwords do not match.</span>
            </div>
            <button type="submit" class="btn-auth">Reset Password</button>
        </form>

        <div class="auth-links">
            <a href="../index.html">← Back to sign in</a>
        </div>
    </div>

    <script>
        function handleReset(e) {
            e.preventDefault();
            const pass1 = document.getElementById('new-password').value;
            const pass2 = document.getElementById('confirm-password').value;
            const errorMsg = document.getElementById('password-error');
            
            if (pass1 !== pass2) {
                errorMsg.style.display = 'block';
                document.getElementById('confirm-password').style.borderColor = '#e53e3e';
            } else {
                errorMsg.style.display = 'none';
                document.getElementById('confirm-password').style.borderColor = 'var(--color-border)';
                // Simulate success
                const btn = document.querySelector('.btn-auth');
                btn.innerText = 'Password Reset!';
                btn.style.background = '#38a169'; // Green success color
                
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1500);
            }
        }
    </script>
</body>
</html>
