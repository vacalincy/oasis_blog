<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - OASIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="../assets/images/brand/favicon2.svg?v=4">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css?v=5">
    <link rel="stylesheet" href="../assets/css/add-post.css">

    <!-- Primary Meta Tags -->
    <meta name="description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://oasis.design/">
    <meta property="og:title" content="OASIS | Curate Your World">
    <meta property="og:description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">
    <meta property="og:image" content="https://oasis.design/assets/images/content/abstractcurvedlight.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://oasis.design/">
    <meta property="twitter:title" content="OASIS | Curate Your World">
    <meta property="twitter:description" content="OASIS is a digital sanctuary for high-end photography, editorial reads, and minimalist design. Escape the noise.">
    <meta property="twitter:image" content="https://oasis.design/assets/images/content/abstractcurvedlight.jpg">
</head>
<body class="editor-page">
    
<nav>
    <div class="container nav__container">
        <a href="discover.html" class="nav__logo">
            <img src="../assets/images/brand/logo.svg" alt="OASIS Logo">
        </a>
        <ul class="nav__items">
            <li><button id="close__nav-btn">✕</button></li>
            <li><a href="discover.html">Discover</a></li>
            <li><a href="following.html">Following</a></li>
            <li><a href="popular.html">Popular</a></li>
            <li><a href="topics.html">Topics</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
        <div class="nav__actions">
            <form action="search.html" method="GET" class="search-bar">
                <img loading="lazy" src="../assets/images/icons/search.svg" alt="Search">
                <input type="text" placeholder="Search stories..." aria-label="Search stories">
            </form>
            <a href="notifications.html" class="notification-btn" aria-label="Notifications">
                <img loading="lazy" src="../assets/images/icons/notification_icon.svg" alt="Notifications">
            </a>
            <a href="dashboard.html" class="avatar">EA</a>
            <button id="open__nav-btn">☰</button>
        </div>
    </div>
</nav>


    <!-- Editor Main Container -->
    <main class="editor-main" id="editor-container">
        
        <!-- Story Title -->
        <input type="text" class="borderless-input editor-title" placeholder="Story Title" aria-label="Story Title">

        <!-- Upload Zone -->
        <div class="editor-upload-zone" id="upload-zone">
            <input type="file" id="cover-upload" hidden accept="image/*">
            <div class="upload-icon-circle">
                <div class="dynamic-icon" style="-webkit-mask-image: url('../assets/images/icons/upload-03.svg'); width: 24px; height: 24px;"></div>
            </div>
            <p>Drag and drop your high-res image here or click to browse</p>
        </div>

        <!-- Subtitle -->
        <input type="text" class="borderless-input editor-subtitle" placeholder="Subtitle.." aria-label="Subtitle">

        <!-- Category Tags -->
        <!-- Categories -->
        <div class="category-wrapper" style="margin-top: 32px;">
            <div class="editor-tags-scrollable" id="main-categories-row"></div>
            <div class="editor-tags-scrollable" id="sub-categories-row" style="margin-top: 16px; "></div>
        </div>

        <!-- Formatting Toolbar -->
        <!-- Formatting Toolbar -->
        <div class="editor-toolbar" id="format-toolbar">
            <button class="toolbar-btn font-serif" id="btn-bold" style="font-weight: bold;">B</button>
            <button class="toolbar-btn font-serif" id="btn-italic" style="font-style: italic;">I</button>
            <button class="toolbar-btn" id="btn-link">
                <span class="dynamic-icon" style="-webkit-mask-image: url('../assets/images/icons/upload-03.svg'); width: 18px; height: 18px;"></span>
            </button>
            <button class="toolbar-btn" id="btn-h2" style="font-weight: bold; font-size: 0.9rem;">H2</button>
            <button class="toolbar-btn font-serif" id="btn-quote" style="font-weight: bold; font-size: 1.2rem;">"</button>
        </div>

        <!-- Body Content -->
        <div contenteditable="true" class="borderless-input editor-body" id="editor-body" data-placeholder="Tell the story behind this shot..."></div>

        <!-- Action Footer -->
        <div class="editor-footer">
            <a href="dashboard.html" class="btn-cancel">Cancel</a>
            <div class="tooltip-wrapper show-tooltip" id="footer-tooltip-wrapper" data-tooltip="Please select a category and subcategory first">
                <button class="btn-ghost-rounded" id="btn-draft" disabled>Save as Draft</button>
                <button class="btn-primary-rounded" id="btn-publish" disabled>Publish Story</button>
            </div>
        </div>
        
    </main>

    <script src="../assets/js/pages/add-post.js"></script>
    <!-- GSAP -->
    <!--suppress HtmlUnknownTarget, JSUnresolvedLibraryURL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!--suppress HtmlUnknownTarget, JSUnresolvedLibraryURL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script src="../assets/js/main-v4.js"></script>
    <script src="../assets/js/about-anim.js"></script>
</body>
</html>
