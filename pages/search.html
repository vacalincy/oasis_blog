<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search — Oasis Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/search.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/brand/favicon2.svg">

    <script src="../assets/js/main.js"></script>
</head>
<body class="search-page">

<!-- ============================================= -->
<!-- SEARCH HERO START                              -->
<!-- ============================================= -->
<div class="search-hero">

    <img loading="lazy" src="../assets/images/content/banner.jpg" alt="Glass blocks reimagined" class="search-hero__bg">

    <div class="search-top-bar">
        <a href="discover.html" class="search-top-bar__back" aria-label="Go back">
            <img loading="lazy" src="../assets/images/icons/arrow-left.svg" alt="Back">
        </a>
        <form action="search.html" method="GET" class="search-bar">
            <img loading="lazy" src="../assets/images/icons/search.svg" alt="Search">
            <input type="text" placeholder="Search stories..." aria-label="Search stories">
            </form>
    </div>

    <div class="search-hero__text">
        <span class="search-hero__eyebrow">Art deco rediscovered</span>
        <h2 class="search-hero__title">Glass blocks, reimagined</h2>
    </div>

</div>
<!-- ============================================= -->
<!-- SEARCH HERO END                                -->
<!-- ============================================= -->


<!-- ============================================= -->
<!-- CURATED BOARDS START                           -->
<!-- ============================================= -->
<section class="curated-boards-section">
    <div class="container">

        <span class="curated-boards__eyebrow">Oasis Curated Boards</span>
        <h2 class="curated-boards__title">Ideas you might like</h2>

        <div class="curated-boards__scroll">

            <a href="category-post.html" class="board-card">
                <div class="board-card__collage">
                    <img loading="lazy" src="../assets/images/content/wedding-1.png" alt="Table setting with flowers" class="board-card__main">
                    <img loading="lazy" src="../assets/images/content/wedding-2.png" alt="Floral arch" class="board-card__small">
                    <img loading="lazy" src="../assets/images/content/wedding-3.png" alt="String lights at venue" class="board-card__small">
                </div>
                <p class="board-card__title">Earthy wedding aesthetic</p>
                <span class="board-card__meta">51 Pins</span>
            </a>

            <a href="category-post.html" class="board-card">
                <div class="board-card__collage">
                    <img loading="lazy" src="../assets/images/content/beach-1.png" alt="Beach house over water" class="board-card__main">
                    <img loading="lazy" src="../assets/images/content/beach-2.png" alt="Ocean view" class="board-card__small">
                    <img loading="lazy" src="../assets/images/content/beach-3.png" alt="Beach chairs" class="board-card__small">
                </div>
                <p class="board-card__title">Sea aesthetic</p>
                <span class="board-card__meta">79 Pins</span>
            </a>

            <a href="category-post.html" class="board-card">
                <div class="board-card__collage">
                    <img loading="lazy" src="../assets/images/content/city-1.jpg" alt="City skyline at night" class="board-card__main">
                    <img loading="lazy" src="../assets/images/content/city-2.jpg" alt="Street with neon signs" class="board-card__small">
                    <img loading="lazy" src="../assets/images/content/city-3.jpg" alt="Rooftop view" class="board-card__small">
                </div>
                <p class="board-card__title">Urban nights</p>
                <span class="board-card__meta">63 Pins</span>
            </a>

        </div>

    </div>
</section>
<!-- ============================================= -->
<!-- CURATED BOARDS END                             -->
<!-- ============================================= -->

<!-- BOTTOM TAB BAR START -->
<div class="tab-bar-wrapper">
  <div class="tab-bar-base">
    <a href="discover.html" class="nav-item ">
       <img src="../assets/images/icons/tabbar_home.png" alt="Home">
    </a>
    <a href="search.html" class="nav-item active">
       <img src="../assets/images/icons/tabbar_search.png" alt="Search">
    </a>
    <a href="add-post.html" class="nav-item ">
       <img src="../assets/images/icons/tabbar_add.png" alt="Add post">
    </a>
    <a href="dashboard.html" class="nav-item ">
       <img src="../assets/images/icons/tabbar_profile.png" alt="Profile">
    </a>
  </div>
  <div class="tab-bar-highlight">
    <div class="nav-item"><img src="../assets/images/icons/tabbar_home.png" alt="Home"></div>
    <div class="nav-item"><img src="../assets/images/icons/tabbar_search.png" alt="Search"></div>
    <div class="nav-item"><img src="../assets/images/icons/tabbar_add.png" alt="Add post"></div>
    <div class="nav-item"><img src="../assets/images/icons/tabbar_profile.png" alt="Profile"></div>
  </div>
</div>
<!-- BOTTOM TAB BAR END -->
</body>
</html>
